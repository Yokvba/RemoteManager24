<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Manager Web</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --panel-alt: #0f172a;
        --accent: #22c55e;
        --danger: #ef4444;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), var(--panel-alt));
        color: var(--text);
      }

      .container {
        width: min(900px, calc(100% - 32px));
        margin: 48px auto;
        padding: 24px;
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow: 0 16px 32px var(--shadow);
      }

      h1, h2 {
        margin-top: 0;
      }

      .status-box {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
        padding: 14px 16px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #f59e0b;
        box-shadow: 0 0 10px rgba(245, 158, 11, 0.7);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
        background: #3b82f6;
        color: white;
      }

      button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      button.danger {
        background: var(--danger);
      }

      .panel {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 16px;
        margin-top: 20px;
      }

      #consoleForm {
        display: flex;
        gap: 12px;
        margin-top: 8px;
      }

      #consoleInput {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
      }

      .output-panel pre {
        margin: 0;
        min-height: 180px;
        max-height: 420px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        padding: 14px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #dbeafe;
      }

      @media (max-width: 640px) {
        .container {
          padding: 18px;
        }

        #consoleForm {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Remote Manager</h1>

      <div class="status-box" id="statusBox">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking server status...</span>
      </div>

      <div class="controls">
        <button id="startBtn">Start</button>
        <button id="stopBtn" class="danger">Stop</button>
        <button id="logsBtn">Current Log</button>
      </div>

      <div class="panel">
        <h2>Server Console</h2>
        <form id="consoleForm">
          <input id="consoleInput" type="text" placeholder="Type a command here" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>

      <div class="panel output-panel">
        <h2>Output</h2>
        <pre id="output">Waiting for server status...</pre>
      </div>
    </div>

    <script>
      const statusText = document.getElementById('statusText');
      const statusDot = document.getElementById('statusDot');
      const outputEl = document.getElementById('output');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const logsBtn = document.getElementById('logsBtn');
      const consoleForm = document.getElementById('consoleForm');
      const consoleInput = document.getElementById('consoleInput');

      const LIVE_REFRESH_MS = 1000;

      async function fetchJson(url, options = {}) {
        const response = await fetch(url, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || 'Request failed.');
        }

        return data;
      }

      function setStatus(online) {
        statusText.textContent = online ? 'Server is online' : 'Server is offline';
        statusText.style.color = online ? '#86efac' : '#fca5a5';
        statusDot.style.background = online ? '#22c55e' : '#ef4444';
        statusDot.style.boxShadow = online
          ? '0 0 10px rgba(34, 197, 94, 0.8)'
          : '0 0 10px rgba(239, 68, 68, 0.8)';
      }

      function setOutput(value) {
        outputEl.textContent = value || 'No output returned.';
      }

      async function refreshLiveData() {
        try {
          const [statusData, logData] = await Promise.all([
            fetchJson('/api/status'),
            fetchJson('/api/logs'),
          ]);

          setStatus(statusData.online);
          setOutput(`Server status: ${statusData.online ? 'Online' : 'Offline'}\n\nLatest log output:\n\n${logData.output || 'No output returned.'}`);
        } catch (error) {
          setStatus(false);
          setOutput(`Live update failed.\n${error.message}`);
        }
      }

      async function actionRequest(endpoint, label) {
        try {
          const data = await fetchJson(endpoint, { method: 'POST' });
          setOutput(`${label}\n\n${data.output || 'No output returned.'}`);
          await refreshLiveData();
        } catch (error) {
          setOutput(`${label} failed.\n${error.message}`);
        }
      }

      startBtn.addEventListener('click', () => actionRequest('/api/start', 'Start output'));
      stopBtn.addEventListener('click', () => actionRequest('/api/stop', 'Stop output'));
      logsBtn.addEventListener('click', async () => {
        try {
          const data = await fetchJson('/api/logs');
          setOutput(`Latest log output\n\n${data.output || 'No output returned.'}`);
        } catch (error) {
          setOutput(`Failed to load logs.\n${error.message}`);
        }
      });

      consoleForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const command = consoleInput.value.trim();

        if (!command) {
          setOutput('Please enter a command to send to the server console.');
          return;
        }

        try {
          const data = await fetchJson('/api/console', {
            method: 'POST',
            body: JSON.stringify({ command }),
          });
          setOutput(`Console output\n\n${data.output || 'No output returned.'}`);
          consoleInput.value = '';
          await refreshLiveData();
        } catch (error) {
          setOutput(`Console command failed.\n${error.message}`);
        }
      });

      refreshLiveData();
      setInterval(refreshLiveData, LIVE_REFRESH_MS);
    </script>
  </body>
</html>
